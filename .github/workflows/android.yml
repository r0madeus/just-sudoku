name: Android APK (slim engine)

# Builds Godot's Android export template with only what the game uses (engine/custom.py), then
# exports the game with it. The template is cached by the profile's hash, so it is only rebuilt
# when the profile or the Godot version changes.
# Branch and PR builds are signed with a throwaway test key: fine for installing and measuring.
# A pushed version tag (v1.0.0) is a release: the APK is signed with the release key from the
# repository secrets (docs/release.md) and published on the Releases page with its checksum.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/android.yml"

# A newer push to the same branch replaces a run still going
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7-stable"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Publishing a release needs it; other builds only read
      contents: write
    # The game is checked out in game/ and everything else beside it: Godot imports and exports
    # every resource under the project folder, so a Godot source tree inside it ends up in the APK
    steps:
      - name: Checkout the game
        uses: actions/checkout@v4
        with:
          path: game

      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(sed -n 's/^version\/name="\(.*\)"/\1/p' game/export_presets.cfg)
          project=$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)
          echo "tag $tag, export $name, project $project"
          if [ "$tag" != "$name" ] || [ "$tag" != "$project" ]; then
            echo "::error::The tag v$tag does not match version/name ($name) in export_presets.cfg and config/version ($project) in project.godot"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" game/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore the slim template
        id: template-cache
        uses: actions/cache@v4
        with:
          path: slim-template
          key: slim-template-${{ env.GODOT_VERSION }}-${{ hashFiles('game/engine/custom.py') }}

      - name: Checkout Godot
        if: steps.template-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}
          path: godot

      - name: Install SCons and the NDK
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install scons
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Build the slim template
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          cd godot
          # swappy must be given here: production=yes only reads it from the command line
          scons -j"$(nproc)" platform=android target=template_release arch=arm64 swappy=no \
            profile="$GITHUB_WORKSPACE/game/engine/custom.py"
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd "$GITHUB_WORKSPACE"
          mkdir -p slim-template
          cp godot/bin/android_release.apk slim-template/
          ls -l slim-template

      - name: Download the Godot editor
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot-editor

      - name: Export the APK
        run: |
          # Editor settings: where Java and the Android SDK are
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          if [ "$IS_RELEASE" = "true" ]; then
            # The release key, from the repository secrets; never written inside the project
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::Release signing secrets are missing: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD (see docs/release.md)"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEYSTORE_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
          else
            # A throwaway key for a test build, outside the project
            keytool -genkeypair -keystore test.keystore -alias test -storepass testpass -keypass testpass \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Just Sudoku test" > /dev/null
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/test.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=test
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=testpass
          fi
          cd game
          # Export with the slim template instead of the official one
          sed -i "s|^custom_template/release=.*|custom_template/release=\"$GITHUB_WORKSPACE/slim-template/android_release.apk\"|" export_presets.cfg
          ../godot-editor --headless --import > /dev/null 2>&1 || true
          mkdir -p ../out
          ../godot-editor --headless --export-release "Android" ../out/JustSudoku-slim.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -l ../out
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Report the size
        run: |
          size() { numfmt --to=si --format="%.1f" --suffix=B "$(stat -c %s "$1")"; }
          lib=$(unzip -lv out/JustSudoku-slim.apk | awk '/libgodot_android.so/ {print $1, $3}')
          {
            echo "### APK size"
            echo "| | |"
            echo "|---|---|"
            echo "| Game APK (slim engine) | $(size out/JustSudoku-slim.apk) |"
            echo "| Slim template | $(size slim-template/android_release.apk) |"
            echo "| libgodot_android.so (unpacked, in APK) | $lib |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: JustSudoku-slim-apk
          path: out/JustSudoku-slim.apk

      - name: Upload the slim template
        uses: actions/upload-artifact@v4
        with:
          name: slim-android-template
          path: slim-template/android_release.apk

      - name: Prepare the release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp out/JustSudoku-slim.apk "release/JustSudoku-$version.apk"
          (cd release && sha256sum "JustSudoku-$version.apk" > "JustSudoku-$version.apk.sha256")
          # The release notes are this version's section of the changelog
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' game/CHANGELOG.md > release/notes.md
          cat release/notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Just Sudoku ${{ github.ref_name }}
          body_path: release/notes.md
          files: |
            release/JustSudoku-*.apk
            release/JustSudoku-*.apk.sha256
