# Flatpak recipe for Just Sudoku.
#
# It wraps the Linux build that CI exports from this repository (tools/build_linux_packages.sh and
# .github/workflows/linux.yml): the game with its data inside, as one binary. The bundle made
# from this file is attached to every release; docs/linux.md says how a Flathub submission
# differs (it names the release's tar.gz and its checksum instead of a local file).
app-id: io.github.r0madeus.JustSudoku
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: JustSudoku

finish-args:
  # A window and sound, nothing else: no network, no access to the home folder. Backups go
  # through the system's file chooser (a portal), which hands over only the chosen file.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: just-sudoku
    buildsystem: simple
    build-commands:
      - install -Dm755 JustSudoku.x86_64 /app/bin/JustSudoku
      - install -Dm644 io.github.r0madeus.JustSudoku.desktop /app/share/applications/io.github.r0madeus.JustSudoku.desktop
      - install -Dm644 io.github.r0madeus.JustSudoku.metainfo.xml /app/share/metainfo/io.github.r0madeus.JustSudoku.metainfo.xml
      - install -Dm644 io.github.r0madeus.JustSudoku.svg /app/share/icons/hicolor/scalable/apps/io.github.r0madeus.JustSudoku.svg
      - install -Dm644 io.github.r0madeus.JustSudoku.png /app/share/icons/hicolor/512x512/apps/io.github.r0madeus.JustSudoku.png
    sources:
      # Paths are relative to this file; CI exports the build to build/linux first
      - type: file
        path: ../../../build/linux/JustSudoku.x86_64
      - type: file
        path: ../io.github.r0madeus.JustSudoku.desktop
      - type: file
        path: ../io.github.r0madeus.JustSudoku.metainfo.xml
      - type: file
        path: ../io.github.r0madeus.JustSudoku.svg
      - type: file
        path: ../io.github.r0madeus.JustSudoku.png
